[package]
name = "passwd-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Line-oriented text filters for wordlists and password files"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
